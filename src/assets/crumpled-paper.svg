<?xml version="1.0" encoding="UTF-8"?>
<!-- Krøllet, sammenkrøllet stykke off-white papir (low-poly facetteret). -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <defs>
    <radialGradient id="cpShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- kontaktskygge under papiret -->
  <ellipse cx="120" cy="178" rx="78" ry="16" fill="url(#cpShadow)"/>

  <!-- facetter (lys oppe til venstre, skygge nede til højre) -->
  <g stroke="#b3a584" stroke-width="0.6" stroke-opacity="0.5" stroke-linejoin="round">
    <polygon points="62,72 98,54 95,95"   fill="#f7f1df"/>
    <polygon points="98,54 130,88 95,95"  fill="#ffffff"/>
    <polygon points="98,54 140,52 130,88" fill="#f4ecd6"/>
    <polygon points="140,52 176,66 130,88" fill="#efe7cf"/>
    <polygon points="176,66 160,110 130,88" fill="#e9dfc4"/>
    <polygon points="176,66 198,100 160,110" fill="#e2d8ba"/>
    <polygon points="198,100 192,138 160,110" fill="#d4c8a6"/>
    <polygon points="160,110 192,138 140,140" fill="#cabd98"/>
    <polygon points="130,88 160,110 120,125" fill="#e3d9bc"/>
    <polygon points="95,95 130,88 120,125"  fill="#f1e9d2"/>
    <polygon points="95,95 120,125 88,128"  fill="#e8dec2"/>
    <polygon points="62,72 95,95 88,128"    fill="#e4dabd"/>
    <polygon points="40,112 62,72 88,128"   fill="#dcd0b1"/>
    <polygon points="40,112 88,128 52,128"  fill="#cfc2a0"/>
    <polygon points="52,128 88,128 74,150"  fill="#d2c6a4"/>
    <polygon points="88,128 120,125 74,150" fill="#dccfb0"/>
    <polygon points="120,125 140,140 118,164" fill="#cabd98"/>
    <polygon points="120,125 118,164 74,150"  fill="#d0c3a1"/>
    <polygon points="160,110 140,140 192,138" fill="#c5b793"/>
    <polygon points="140,140 160,160 118,164" fill="#bdae8a"/>
    <polygon points="160,110 192,138 160,160" fill="#c0b28d"/>
    <polygon points="160,160 140,140 118,164" fill="#b6a784"/>
  </g>

  <!-- skarpe folde-/lys-linjer -->
  <g stroke-linecap="round" fill="none">
    <path d="M98,54 L120,125 L74,150" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M176,66 L120,125 L140,140" stroke="#a99a76" stroke-opacity="0.6" stroke-width="1.2"/>
    <path d="M95,95 L160,110" stroke="#fff" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
