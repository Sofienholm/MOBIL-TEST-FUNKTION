<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pladsholder-kvittering (1955, smykkeforretning).
  Erstat denne med din egen receipt.png — se README ("Hvor kvitteringsbilledet skal ligge").
-->
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="900" viewBox="0 0 620 900">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.86  0 0 0 0 0.82  0 0 0 0 0.70  0 0 0 0.10 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="age" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdc"/>
      <stop offset="0.5" stop-color="#efe6cf"/>
      <stop offset="1" stop-color="#e7dcc0"/>
    </linearGradient>
  </defs>

  <!-- papir -->
  <rect x="14" y="14" width="592" height="872" rx="6" fill="url(#age)" stroke="#cdbf9a" stroke-width="2"/>
  <rect x="14" y="14" width="592" height="872" rx="6" fill="#000" opacity="0.05" filter="url(#paper)"/>

  <!-- hoved -->
  <text x="310" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="46" letter-spacing="3" fill="#7a1f1f" font-weight="bold">GULDSMED</text>
  <text x="310" y="130" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" letter-spacing="6" fill="#2a2a2a">A. SØRENSEN</text>
  <text x="310" y="160" text-anchor="middle" font-family="Georgia, serif"
        font-size="15" letter-spacing="2" fill="#555">GULD · SØLV · URE · JUVELER</text>
  <text x="310" y="182" text-anchor="middle" font-family="Georgia, serif"
        font-size="13" fill="#666">Søndergade 14 · Telf. 247</text>

  <line x1="60" y1="208" x2="560" y2="208" stroke="#7a1f1f" stroke-width="2"/>
  <text x="310" y="236" text-anchor="middle" font-family="Georgia, serif"
        font-size="20" letter-spacing="8" fill="#2a2a2a">R E G N I N G</text>
  <line x1="60" y1="252" x2="560" y2="252" stroke="#7a1f1f" stroke-width="1"/>

  <!-- dato/kunde -->
  <text x="70"  y="292" font-family="Georgia, serif" font-size="17" fill="#333">Dato:</text>
  <text x="180" y="292" font-family="'Brush Script MT', cursive, serif" font-size="20" fill="#243a5a">14. marts 1955</text>
  <text x="70"  y="322" font-family="Georgia, serif" font-size="17" fill="#333">Modtaget af:</text>
  <text x="260" y="322" font-family="'Brush Script MT', cursive, serif" font-size="20" fill="#243a5a">— — —</text>

  <!-- linjer -->
  <line x1="70" y1="356" x2="550" y2="356" stroke="#bbb" stroke-width="1"/>
  <text x="70"  y="404" font-family="Georgia, serif" font-size="19" fill="#222">1 stk.  .................................</text>
  <text x="470" y="404" font-family="Georgia, serif" font-size="20" fill="#222" font-weight="bold">kr. 4 5 0,—</text>
  <text x="70"  y="438" font-family="Georgia, serif" font-size="14" fill="#8a3b2e" font-style="italic">(varebetegnelse mangler)</text>

  <line x1="70" y1="470" x2="550" y2="470" stroke="#bbb" stroke-width="1"/>
  <line x1="70" y1="506" x2="550" y2="506" stroke="#bbb" stroke-width="1"/>
  <line x1="70" y1="542" x2="550" y2="542" stroke="#bbb" stroke-width="1"/>

  <!-- total -->
  <rect x="300" y="566" width="250" height="56" fill="none" stroke="#7a1f1f" stroke-width="2"/>
  <text x="320" y="602" font-family="Georgia, serif" font-size="20" fill="#222">I alt</text>
  <text x="530" y="602" text-anchor="end" font-family="Georgia, serif" font-size="24" fill="#7a1f1f" font-weight="bold">kr. 450,—</text>

  <!-- betalt-stempel -->
  <g transform="rotate(-14 360 690)">
    <rect x="250" y="660" width="220" height="60" rx="6" fill="none" stroke="#9a2b2b" stroke-width="3" opacity="0.75"/>
    <text x="360" y="700" text-anchor="middle" font-family="Georgia, serif"
          font-size="30" letter-spacing="4" fill="#9a2b2b" opacity="0.8" font-weight="bold">BETALT</text>
  </g>

  <text x="310" y="820" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#777">Tak for handelen — ombytning kun mod kvittering</text>
  <text x="310" y="846" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#999" font-style="italic">Industrimuseet · Arbejderboliger 1955</text>
</svg>
